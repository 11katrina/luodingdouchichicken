<!-- 个人中心 -->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>个人中心</title>
    <link rel="stylesheet" href="../../layui/css/layui.css" />
    <!-- 引入element样式 -->
    <link rel="stylesheet" href="../../xznstatic/css/element.min.css" />
    <!-- 样式 -->
    <link rel="stylesheet" href="../../xznstatic/css/style.css" />
    <!-- 主题（主要颜色设置） -->
    <link rel="stylesheet" href="../../css/theme.css" />
    <!-- 通用的css -->
    <link rel="stylesheet" href="../../xznstatic/css/common.css" />
    <link rel="stylesheet" href="../../xznstatic/css/bootstrap.min.css" />
  </head>
  <style>
    html::after {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      bottom: 0;
      content: "";
      display: block;
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
      z-index: -1;
    }

    /*小菜单*/
    .prolist .left_nav {
      background: #fff;
      width: 220px;
    }
    .prolist .left_nav .dlx1 {
      padding: 15px 0;
      padding-left: 20px;
      background: var(--publicMainColor);
      color: #fff;
    }
    .prolist .left_nav .dlx1 dt {
      font-size: 22px;
      font-weight: bold;
    }
    .prolist .left_nav .dlx1 dd {
      padding-top: 5px;
      font-size: 14px;
      font-weight: 200;
    }
    .prolist .left_nav .dlx2 {
      padding: 15px 0;
      padding-left: 20px;
      background: var(--publicMainColor);
      color: #fff;
    }
    .prolist .left_nav .dlx2 dt {
      font-size: 14px;
    }
    .prolist .left_nav .dlx2 dd {
      padding-top: 5px;
      font-size: 22px;
      color: var(--publicSubColor);
      font-family: impact;
    }
    .prolist .left_nav ul {
      padding: 20px;
    }
    .prolist .left_nav ul li {
      display: block;
      margin-bottom: 15px;
    }
    .prolist .left_nav ul li:last-child {
      margin-bottom: 0;
    }
    .prolist .left_nav ul li {
      background-color: var(--publicSubColor);
      display: block;
      border: 1px solid #ddd;
      padding: 15px 10px;
      color: #666;
      font-size: 12px;
    }
    .prolist .left_nav ul li i {
      color: var(--publicMainColor);
      margin-right: 10px;
    }
    .prolist .left_nav ul li:hover {
      border: 1px solid var(--publicMainColor);
      background: var(--publicMainColor);
      color: #fff;
    }
    .prolist .left_nav ul li:hover i {
      color: var(--publicSubColor);
    }
    .onclickbiaoqian {
      color: #fff !important;
      background-color: var(--publicMainColor) !important;
    }
    .onclickbiaoqian i {
      color: var(--publicSubColor) !important;
    }
    /*信息样式*/
    .center-container {
      width: 1200px;
      margin: 0 auto;
      margin-top: 20px;
      text-align: left;
      display: flex;
      margin-bottom: 20px;
    }
    .right-container {
      position: relative;
    }
    .right-container .layui-form-item {
      display: flex;
      align-items: center;
    }
    .right-container .layui-input-block {
      margin: 0;
      flex: 1;
    }
    .right-container .input .layui-input {
      padding: 0 12px;
      height: 40px;
      font-size: 15px;
      border-radius: 4px;
      border-width: 1px;
      border-style: solid;
      background-color: #fff;
      text-align: left;
    }
    .right-container .select .layui-input {
      padding: 0 12px;
      height: 40px;
      font-size: 15px;
      border-radius: 4px;
      border-width: 1px;
      border-style: solid;
      background-color: #fff;
      text-align: left;
    }
    .right-container .date .layui-input {
      padding: 0 12px;
      height: 40px;
      font-size: 15px;
      color: rgba(160, 67, 26, 1);
      border-radius: 4px;
      border-width: 1px;
      border-style: solid;
      background-color: #fff;
      box-shadow: 0 0 0px rgba(255, 0, 0, 0.8);
      text-align: left;
    }
  </style>
  <body class="bodyClass">
    <div id="app">
      <!-- 标题 -->
      <div class="center-container">
        <!-- 个人中心菜单 config.js-->
        <div class="prolist">
          <div class="left_nav">
            <dl class="dlx1">
              <dt>个人中心</dt>
              <dd>USER / CENTER</dd>
            </dl>
            <ul>
              <li
                v-for="(item,index) in centerMenu"
                v-bind:key="index"
                @click="jump(item.url)"
                :class="item.url=='../yonghu/customerService.html'?'onclickbiaoqian':''"
              >
                <i class="layui-icon">&#xe6b1;</i>{{item.name}}
              </li>
            </ul>
          </div>
        </div>
        <!-- 个人中心菜单 -->
        <!-- 个人中心 -->
        <div
          class="right-container sub_borderColor"
          :style='{"backgroundColor":"#fff","padding":"20px","boxShadow":"0px rgba(255,0,0,.8)","margin":"0","backgroundColor":"#fff","borderRadius":"0","borderWidth":"1px","borderStyle":"solid","width":"80%"}'
        >
          <div class="dialog-box" style="background-color: gainsboro">
            <div
              class="dialog-box-title"
              style="
                display: flex;
                gap: 1rem;
                align-items: center;
                justify-items: self-end;
              "
            >
              <div
                class="avatar"
                style="
                  border-radius: 50%;
                  background-color: aquamarine;
                  width: 4rem;
                  height: 4rem;
                "
              ></div>
              <div class="detail">
                <strong class="detail-title">智能客服</strong>
                <div class="detail-desc">你的智能客服，随时为您服务！</div>
              </div>
            </div>
          </div>

          <div
            class="dialog-box-content"
            style="height: 20rem; overflow-y: scroll"
          >
            <div v-for="(item,index) in contentList" :key="index">
              <div
                class="customer-content-item"
                v-if="item.type === 'customer'"
                style="display: flex; padding: 0.5rem"
              >
                <div
                  class="avatar"
                  style="
                    border-radius: 50%;
                    background-color: aquamarine;
                    width: 2rem;
                    height: 2rem;
                  "
                ></div>
                <div class="content" style="padding-left: 0.5rem">
                  {{item.content}}
                </div>
              </div>
              <div class="user-content-item" v-else></div>
            </div>
          </div>

          <div class="user-input">
            <input
              type="text"
              class="layui-input"
              placeholder="请输入您的问题"
              style="width: 100%"
            />
            <button class="layui-btn layui-btn-primary">发送</button>
          </div>
        </div>
        <!-- 个人中心 -->
      </div>
    </div>

    <!-- layui -->
    <script src="../../layui/layui.js"></script>
    <!-- vue -->
    <script src="../../js/vue.js"></script>
    <!-- 引入element组件库 -->
    <script src="../../xznstatic/js/element.min.js"></script>
    <!-- 组件配置信息 -->
    <script src="../../js/config.js"></script>
    <!-- 扩展插件配置信息 -->
    <script src="../../modules/config.js"></script>
    <!-- 工具方法 -->
    <script src="../../js/utils.js"></script>
    <!-- 校验格式工具类 -->
    <script src="../../js/validate.js"></script>

    <script>
      var vue = new Vue({
        el: "#app",
        data: {
          //项目路径
          baseUrl: "",
          centerMenu: centerMenu,
          contentList: [
            {
              type: "customer",
              content: "你好！我是智能客服，有什么可以帮助您的？",
            },
          ],
        },
        updated: function () {
          // layui.form.render(null, 'myForm');
        },
        methods: {
          jump(url) {
            jump(url);
          },
        },
      });

      layui.use(
        [
          "layer",
          "element",
          "carousel",
          "http",
          "jquery",
          "laydate",
          "form",
          "upload",
        ],
        function () {
          var layer = layui.layer;
          var element = layui.element;
          var carousel = layui.carousel;
          var http = layui.http;
          var jquery = layui.jquery;
          var form = layui.form;
          var upload = layui.upload;
          vue.baseUrl = http.baseurl;
        }
      );

      //性别的查询
      function sexTypesSelect() {
        //填充下拉框选项
        layui.http.request(
          "dictionary/page?page=1&limit=100&sort=&order=&dicCode=sex_types",
          "GET",
          {},
          (res) => {
            if (res.code == 0) {
              vue.sexTypesList = res.data.list;
            }
          }
        );
      }
    </script>
  </body>
</html>
